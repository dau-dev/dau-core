int32-row-unpack:
  _target_: dau_core.cores.CoreDefinition
  name: int32-row-unpack
  kind: operator
  module: dau_int32_row_unpack
  source: dau_int32_row_unpack.sv
  description: 'Row-unpack front-end feed over <=64-bit packed rows: bit-extracts four configured fields (offset/width/signed)
    from one packed word and widens them into the standard 16-byte int32 quad row (field 0 = key = w0.lo) the operator tiles
    consume. The compact-row feed answer to the DDR-byte-bandwidth-bound scan (~2x rows/sec off DDR, half the host DMA,
    operators unchanged). Covers q6 (59-bit) and q1 (63-bit) packings. The batch-latched cfg_bypass config port selects
    the mode: 0 = unpack (packed word in, quad row out); 1 = a zero-added-latency passthrough of pre-widened 16-byte quad
    rows (two words per row, field descriptors unused), so ONE bitstream benchmarks packed vs unpacked rows on the same
    silicon and isolates the host packing overhead. OUT_WIDTH (the rows/cycle axis) selects the quad-stream framing: 64
    (default) emits two 64-bit beats per row; 128 emits one whole quad row per beat ({w1, w0}), lifting the shared-front
    emit cap from ~1 row per 2 cycles to 1 row/cycle (silicon showed the 2-beat emit, not the DDR, gates the packed feed)
    — bypass then gearboxes each two-word quad into one beat. FOLLOW-UP: the scan composition must stage packed rows + place
    this after the burst reader before broadcast/partition, and the flywheel needs a pack-schema deriving field offsets/widths
    from column ranges.'
  golden: dau_core.operators:unpack_rows
  bench: dau_core.tests.cocotb_benches.dau_int32_row_unpack_tb
  # Measured 2026-08-11 via dau-build task=tasks/build/synthesize-cores.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {OUT_WIDTH: 64}
      lut: 1443
      ff: 197
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 1.529
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {OUT_WIDTH: 64}
      lut: 1443
      ff: 197
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 3.441
  contract_kind: row-stream
  record_words: 1
  output_record_words: 2
  # framing-shaped: min(1, OUT_WIDTH/128) — the 64-bit quad-stream emit is
  # 1/2 (two beats per row), OUT_WIDTH=128 sustains 1 (silicon-proven)
  ingest:
    rows: 1
    per_cycles: 1
    frames_on_param: OUT_WIDTH
  parameters:
    OUT_WIDTH:
      default: 64
      choices:
      - 64
      - 128

