    rows: 1
    per_cycles: 5
  success_close_out: true
  parameters:
    CAPACITY:
      default: 1024
      minimum: 1
      maximum: 16384
    VALUE_WIDTH:
      # the ELEMENT TYPE of a stored word, not a bit count. The arena never
      # interprets what it holds, so every type is admissible here -- the
      # bound is the packing one: the value lane rides above the fixed 32-bit
      # ADDRESS lane in one 64-bit word. int32 encodes as 32, so this declares
      # exactly the tile it always built, and storage_intent's 4 bytes per
      # word is that type's size.
      element_type: true
      default: int32
      minimum: 8
      maximum: 32
      # only int32 is MEASURED; the RTL elaborates the whole declared range,
      # and widening this list is a measurement task, not an RTL one
      choices: [int32]
  # OOC on both parts, 8 ns, CAPACITY=1024. The first run of this tile
  # landed in 512 LUTs of distributed RAM because the arena access lived in
  # the reset-carrying FSM process; the dedicated reset-free process infers
  # the intended RAMB36.
  resources:
