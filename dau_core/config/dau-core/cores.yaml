record-gearbox:
  _target_: dau_core.cores.CoreDefinition
  name: record-gearbox
  kind: operator
  module: dau_record_gearbox
  source: dau_record_gearbox.sv
  description: 'NoC framing adapter: reads IN_WIDTH-bit beats and emits ONE WHOLE RECORD per cycle on a RECORD_WORDS*64-bit
    bus, records packed back-to-back and straddling beat boundaries. A pure reframing (no field inspected, reordered or
    dropped), so the golden is the identity on the record sequence and the property that matters is the RATE. Exists because
    a consumer reading N-word records through a 64-bit port costs N cycles per record, which starves replicated lanes behind
    it; pairs with the key-mask dispatcher''s RECORD_INPUT framing.'
  golden: dau_core.operators:gearbox_records
  bench: dau_core.tests.cocotb_benches.dau_record_gearbox_tb
  # OOC IN_WIDTH=512 RECORD_WORDS=3 xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +2.533)
  # Measured 2026-08-11 via dau-build task=tasks/build/synthesize-cores.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {IN_WIDTH: 512, RECORD_WORDS: 3}
      lut: 3836
      ff: 1451
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 2.062
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {IN_WIDTH: 512, RECORD_WORDS: 3}
      lut: 3836
      ff: 1451
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 3.699
  contract_kind: row-stream
  # one record per cycle when the bus can supply one: the input delivers
  # IN_WIDTH/64 words per cycle against RECORD_WORDS per record, so the
  # achievable rate is min(1, beat_words/record_words). Declared as the
  # 512-bit/3-word case the hero uses.
  ingest:
    rows: 1
    per_cycles: 1
  record_words_param: RECORD_WORDS
  output_record_words_param: RECORD_WORDS
  parameters:
    IN_WIDTH:
      default: 512
      choices: [128, 256, 512]
    RECORD_WORDS:
      default: 3
      minimum: 1
      maximum: 16

int32-key-mask-dispatcher:
  _target_: dau_core.cores.CoreDefinition
  name: int32-key-mask-dispatcher
  kind: operator
  module: dau_int32_key_mask_dispatcher
  source: dau_int32_key_mask_dispatcher.sv
  description: 'Key-mask dispatcher: fans one scan of 16-byte quad rows to NUM_PARTITIONS lanes by the key''s low bits (dest
    = key & (NUM_PARTITIONS-1), a power of two) — the broadcast + per-lane pair-key-filter shape folded into one shared
    router, so each row is delivered once instead of N times. MODE selects the decode (dau_core.operators.DispatchMode):
    0 MASK (the low-bits default), 1 EXACT_BRANCH — the q19 disjunct-branch mode, dest = key - 1 for keys in
    [1, NUM_PARTITIONS] with every other key DROPPED at the front for zero lane cycles (no power-of-two requirement) —
    and 2 HASH, dest = the top log2(N) bits of key * 0x9E3779B9. MASK reads the key''s LOW bits, so keys sharing a stride
    collapse onto one lane; HASH mixes the whole key into the high bits before the select, which is the fan-out for keys
    the host did not choose. The multiplier and bit-extraction are CONTRACT: a row''s partition is part of the answer. IN_WIDTH (the rows/cycle axis) selects the input framing: 64 (default) accepts two-beat
    quad rows; 128 accepts one whole row per beat ({w1, w0}) — paired with the wide row-unpack (OUT_WIDTH=128) the shared
    front sustains 1 row/cycle while the per-lane outputs stay the 64-bit two-beat framing the operator tiles consume (no
    operator widens). Same-lane runs throttle on the lane''s two-beat drain (single-row skid, head-of-line); mask-distributed
    keys sustain the full front rate.'
  golden: dau_core.operators:mask_dispatch_rows
  bench: dau_core.tests.cocotb_benches.dau_int32_key_mask_dispatcher_tb
  # Still a SCALAR envelope (this core's migration to (part, clock, params)
  # measured points is open debt). It must therefore report the WORST case
  # over the parameter space, because a scalar envelope ignores params:
  # MODE=HASH costs 3 DSPs for the 32x32 multiply where MASK/EXACT_BRANCH
  # cost none (measured 2026-08-06 at NUM_PARTITIONS=4, IN_WIDTH=128:
  # MASK 176 LUT / 1049 FF / 0 DSP, HASH 188 / 1049 / 3, both parts met,
  # WNS +5.359 vs +5.250 on Artix). Under-reporting DSPs would let a
  # hash-dispatched design price as free and overflow at implementation --
  # the failure the measured-point discipline exists to prevent -- so the
  # declared dsp is the hash cost even for mask designs.
  # Measured 2026-08-11 via dau-build task=tasks/build/synthesize-cores.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {NUM_PARTITIONS: 4, RECORD_WORDS: 2, IN_WIDTH: 64, RECORD_INPUT: 0, MODE: 0}
      lut: 277
      ff: 1188
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 4.738
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {NUM_PARTITIONS: 4, RECORD_WORDS: 2, IN_WIDTH: 64, RECORD_INPUT: 0, MODE: 0}
      lut: 277
      ff: 1188
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 5.698
    # the wide record-input point the front-gearbox compositions use
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {NUM_PARTITIONS: 4, RECORD_WORDS: 3, IN_WIDTH: 192, RECORD_INPUT: 1, MODE: 0}
      lut: 309
      ff: 1565
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 5.152
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {NUM_PARTITIONS: 4, RECORD_WORDS: 3, IN_WIDTH: 192, RECORD_INPUT: 1, MODE: 0}
      lut: 309
      ff: 1565
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 6.163
  contract_kind: row-stream
  record_words_param: RECORD_WORDS
  # framing-shaped: min(1, IN_WIDTH/128) — 64-bit two-beat framing is 1/2,
  # 128 is 1, wider stays 1 (the serializer forwards one row per cycle;
  # silicon 2026-07-30). Assumes mask-distributed keys (same-lane runs
  # throttle on the lane drain — documented above).
  # RATE LIMITATION: this declaration is valid at RECORD_WORDS=2 only. The
  # 64-bit front ingests one WORD per cycle, so an N-word record costs N
  # cycles (1/3 for the as-of record, not 1/2) — while a wide framing
  # delivers a whole record per beat-slot. Those are two different rules
  # and the current rate shapes (fixed / frames_on_param /
  # scales_with_param) cannot express the pair. record_words_param now makes
  # the ABI shape explicit for mismatch detection, but this detection-only
  # increment deliberately does not alter the rate model. A composition using
  # RECORD_WORDS != 2 remains OVER-predicted by throughput_rows_per_cycle and
  # must be hand-checked until rates compose with record shape.
  ingest:
    rows: 1
    per_cycles: 1
    frames_on_param: IN_WIDTH
  parameters:
    NUM_PARTITIONS:
      default: 4
    RECORD_WORDS:
      # 64-bit words per routed record: 2 is the 16-byte quad row (every
      # existing composition, byte-identical). Wider records route WHOLE on
      # word 0's low half, so a per-key sequential chain (the as-of join's
      # 3-word record) can be replicated across lanes with no reshaping.
      # Only the 64-bit framing supports != 2 — wide beats are quad rows.
      default: 2
      minimum: 1
      maximum: 16
    IN_WIDTH:
      default: 64
      choices:
      - 64
      - 128
      - 192
      - 256
      - 512
    RECORD_INPUT:
      # whole-record framing (paired with the record gearbox): input_data is
      # ONE RECORD wide, so the router ingests a record per cycle instead of
      # one word. Requires IN_WIDTH == RECORD_WORDS*64.
      default: 0
      choices: [0, 1]
    MODE:
      # dau_core.operators.DispatchMode: 0 MASK, 1 EXACT_BRANCH, 2 HASH
      default: 0
      choices:
      - 0
      - 1
      - 2

