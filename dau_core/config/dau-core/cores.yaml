normal-cdf:
  _target_: dau_core.cores.CoreDefinition
  name: normal-cdf
  kind: operator
  module: dau_normal_cdf
  source: dau_normal_cdf.sv
  description: 'Standard normal CDF over 16-byte quad rows: the destination field is rewritten as Phi of the source field
    in Q(32-F).F. GENERATED -- its per-segment Taylor coefficients are transcendental constants at the configured
    internal precision, which SystemVerilog cannot compute at elaboration. CORRECTLY ROUNDED over every one of the
    573,441 representable inputs where the answer is neither 0 nor 1 to the last bit, swept exhaustively, so for this
    tile the algorithm and the mathematics coincide and the bench compares with zero tolerance. TOTAL: every input has
    an answer and there is NO error path -- beyond the domain the result saturates to 0 or 1.0 and that saturation is
    the correctly rounded answer, not a clamp. Symmetry is folded so only the positive half is approximated. Matches
    dau_core.fixed_point.NormalCdfDatapath.evaluate.'
