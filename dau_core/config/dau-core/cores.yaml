time-bucket-key:
  _target_: dau_core.cores.CoreDefinition
  name: time-bucket-key
  kind: operator
  module: dau_time_bucket_key
  source: dau_time_bucket_key.sv
  description: 'Generic time-bucket key rewrite: replaces a row''s partition key with a composite (partition, time-bucket)
    group key so a downstream key-grouped aggregator (bar / grouped-sum) produces fixed-width TIME-WINDOWED groups per partition
    — workload-agnostic (finance time bars, TSBS window shapes, ...); the aggregation and any per-row derivation stay in
    their own tiles. bucket = time >>> cfg_bucket_shift (window = 2**shift); key = {partition[PART_BITS-1:0], bucket[BUCKET_BITS-1:0]}
    (PART_BITS = 32 - BUCKET_BITS) so it changes exactly on a partition-or-bucket boundary (the stream is pre-sorted by
    (partition, time)); the downstream recovers partition = key >>> BUCKET_BITS. Contract: the partition id fits PART_BITS
    bits and the host-rebased bucket fits BUCKET_BITS, so they never collide — ENFORCED by the tile (a partition or bucket
    that overflows its width is ERR_RANGE, never a silent alias). A mid-lane transform: silent on success (1:1 rows, output_last
    rides the last row), status on a torn row (ERR_STREAM) or an out-of-range key (ERR_RANGE); payload passes through.'
  golden: dau_core.operators:time_bucket_key_rows
  bench: dau_core.tests.cocotb_benches.dau_time_bucket_key_tb
  # OOC BUCKET_BITS=16 xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +2.175)
  # Measured 2026-08-11 via dau-build task=tasks/build/synthesize-cores.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {BUCKET_BITS: 16, KEY_WIDTH: int32}
      lut: 245
      ff: 305
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 2.085
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {BUCKET_BITS: 16, KEY_WIDTH: int32}
      lut: 245
      ff: 305
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 3.706
  contract_kind: row-stream
  record_words: 3
  output_record_words: 2
  # bench measured 256 rows / 1788 cycles = 6.98 cycles/row (2026-07-31)
  ingest:
    rows: 1
    per_cycles: 7
  parameters:
    BUCKET_BITS:
      default: 16
      maximum: 31
    KEY_WIDTH:
      # the ELEMENT TYPE of the partition id, the composite (partition,
      # bucket) key it becomes, and the payload lanes beside them. THE TIME
      # AXIS IS NOT THIS ELEMENT: it is a signed INT64 in its own word at
      # every key width, because nanosecond timestamps need one. The key is a
      # packed group identity rather than a magnitude, so only float is
      # refused. int32 encodes as 32, so this declares exactly the tile it
      # always built -- and BUCKET_BITS' maximum of 31 is that width's bound
      # (the tile's own relation guard is BUCKET_BITS < KEY_WIDTH).
      element_type: true
      default: int32
      minimum: 8
      maximum: 32
      # only int32 is MEASURED; the RTL elaborates the whole declared range
      choices: [int32]

