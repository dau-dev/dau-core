hash-grouped-aggregation:
  _target_: dau_core.cores.CoreDefinition
  name: hash-grouped-aggregation
  kind: operator
  module: dau_hash_grouped_aggregation
  source: dau_hash_grouped_aggregation.sv
  description: 'Hash-mode grouped field-sum aggregation over quad rows: one INT64 accumulator set per DISTINCT key
    in a CAPACITY-slot table, drained signed-key ASCENDING at close-out. Where grouped-field-sum-aggregation
    groups CONSECUTIVE equal keys — needing the staged table pre-sorted on the group key, and opening a second
    partial whenever a key reappears — this tile holds per-key state, so input order does not matter and a key may
    reappear anywhere in the batch: one record per distinct key, always. That removes the sorted_by_key staging
    precondition from every grouped scan. Hash (low key bits) + linear probe over a {sums[3:0], count, key} BRAM
    with a separate valid array; deliberately SEQUENTIAL (one row in flight), so no read-modify-write hazard
    exists. All four field sums accumulate unconditionally — the accumulate path is config-free and cfg_field_mask
    selects only which sums the drain emits, so the record shape matches the ordered tile word-for-word (shared
    host decode). The ascending drain is a CONTRACT, not an implementation detail: a hash table has no intrinsic
    order, so leaking probe order would make results depend on the hash function. Overflow (a new key with the
    table full) is GROUP_CAPACITY_EXCEEDED and invalidates the batch — never an eviction; the host recovers by
    key-range split and merge (dau_core.operators.merge_hash_grouped is exact because INT64 sums and counts are
    additive per key). State is fresh per batch: the CLEAR sweep runs from both reset and close-out. A zero mask
    is BAD_FIELD_MASK; input_last on a quad row w0 is BAD_STREAM. Matches
    dau_core.operators.hash_grouped_field_sum_rows.'
  golden: dau_core.operators:hash_grouped_field_sum_rows
  bench: dau_core.tests.cocotb_benches.dau_hash_grouped_aggregation_tb
  # Measured 2026-08-06 after the JUDGE/ACCUM retime, replacing the points
  # for the pre-ACCUM netlist -- those measured +0.410 out of context and
  # then MISSED composed timing at -0.348, and splitting the accumulate
  # changed the netlist they described.
  #
  # The retime bought 1.6 ns on the Artix (+0.413 -> +2.027 at CAPACITY
  # 1024), which moves the tile out of the band where an out-of-context
  # margin says nothing about a composed build. It cost 285 FF -- the
  # latched base is 4x64 sums plus a 32-bit count, and 288 bits is what that
  # is -- and about 60 LUT. Area for a whole nanosecond of slack.
  #
  # LUT/FF stay nearly flat in CAPACITY (the datapath is one row and four
  # 64-bit accumulators; only the address and probe counters widen), while
  # BRAM steps 4.5 -> 9.0 at 1024: the 320-bit slot spans multiple RAMB36
  # and the depth crosses their 512-deep boundary. The two parts synthesize
  # identically here; only the slack differs.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {CAPACITY: 256, FIELD_WIDTH: int32}
      lut: 834
      ff: 1148
      bram36: 4.5
      dsp: 0
      timing: met
      wns_ns: 2.035
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {CAPACITY: 512, FIELD_WIDTH: int32}
      lut: 883
      ff: 1152
      bram36: 4.5
      dsp: 0
      timing: met
      wns_ns: 2.048
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {CAPACITY: 1024, FIELD_WIDTH: int32}
      lut: 905
      ff: 1156
      bram36: 9.0
      dsp: 0
      timing: met
      wns_ns: 2.027
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {CAPACITY: 256, FIELD_WIDTH: int32}
      lut: 834
      ff: 1148
      bram36: 4.5
      dsp: 0
      timing: met
      wns_ns: 3.498
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {CAPACITY: 512, FIELD_WIDTH: int32}
      lut: 883
      ff: 1152
      bram36: 4.5
      dsp: 0
      timing: met
      wns_ns: 3.499
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {CAPACITY: 1024, FIELD_WIDTH: int32}
      lut: 905
      ff: 1156
      bram36: 9.0
      dsp: 0
      timing: met
      wns_ns: 3.49
  count_port: group_count
  contract_kind: row-stream
  record_words: 2
  # SUM + COUNT over INT32 inputs, per group — the same advertisement the
  # ordered sibling makes, so a composition built only from this tile is
  # discoverable by the planner rather than reporting an empty bitmap
  opcodes:
  - 3
  - 4
  opcode_input_types:
  - 12
  unit_kind: aggregation
  # the mask selects how many sum words ride each record (key + 1..4 sums +
  # count), exactly like the ordered tile
  output_record_words_variable: true
  ingest:
    rows: 1
    # the zero-collision cadence: W0+W1+PROBE+JUDGE+ACCUM = 5 cycles/row.
    # ACCUM is the retime that closes composed timing — the base select and
    # the four 64-bit adds no longer share a cycle with the BRAM write.
    # Acceptance for probe depth p is 2p+3, so the STATED ASSUMPTION is
    # hash-distributed keys at low load factor (p ~= 1); two resident keys
    # congruent modulo CAPACITY already cost 7, and adversarial congruent
    # fills degrade to 1/(2*CAPACITY+3) — a planner-regime concern per the
    # IngestRate doctrine, visible here rather than hidden behind a padded
    # number (the keyed-state precedent). The key-ascending DRAIN is a
    # further O(CAPACITY x live groups) paid once per batch at close-out,
    # outside the per-row cadence like every terminal's record emission.
    per_cycles: 5
  success_close_out: true
  parameters:
    CAPACITY:
      default: 512
      maximum: 1024
    FIELD_WIDTH:
      # the ELEMENT TYPE of one field lane. The 128-bit row is the transport
      # unit and stays fixed, so field i is its i-th lane at this width; the
      # tile keeps the four lanes it names and ignores any a narrower type
      # leaves beyond them. int32 encodes as 32, so this declares exactly the
      # tile that has always been built.
      element_type: true
      default: int32
      # the record bounds it from above, not the row: the sums are INT64 and
      # the element statistics ride 32-bit record slots, so a wider element
      # would need a versioned record -- a different tile
      minimum: 8
      maximum: 32
      # only int32 is MEASURED; the RTL elaborates the whole declared range
      choices: [int32]
  storage_intent:
    - role: group_table
      access: owned
      bytes_per_unit: 40
      scale_parameter: CAPACITY
      tier_hint: bram

streaming-top-k:
  _target_: dau_core.cores.CoreDefinition
  name: streaming-top-k
  kind: operator
  module: dau_streaming_top_k
  source: dau_streaming_top_k.sv
  description: 'Streaming top-k tile (ORDER BY <key> DESC LIMIT K): over quad rows (key, v0, v1, v2) keeps the K rows with
    the largest signed-INT32 sort key (field 0), ties by arrival (earliest wins), and at close-out drains them sorted key-descending
    — the q3/q10 and TSBS group-by-order-by-limit shape. The retained set lives in a size-K systolic sorted register array
    where every cell makes a LOCAL compare-and-shift decision (constant critical path regardless of K, one row every two
    cycles); physical position encodes arrival order so equal-key ties resolve for free (a later row inserts after an earlier
    equal key via a strict < compare) with no arrival counter. A row inserts iff some cell is empty or its key is strictly
    less than the arriving key. Matches dau_core.operators.streaming_top_k. K is compile-time (the host/compiler validates
    K in [1, 128] = dau_core.operators.TOP_K_MAX, BAD_K at composition time), enforced by an elaboration guard. A row torn
    by input_last on w0 is ERR_STREAM.'
  golden: dau_core.operators:streaming_top_k
  bench: dau_core.tests.cocotb_benches.dau_streaming_top_k_tb
  # Full K surface on one unchanged source, measured via synthesize-cores
  # (2026-08-04 sweep): K in {1, 5, 8, 16, 32, 64, 128} x both parts. LUT
  # scales linearly (~152/cell) and WNS is flat across K on both parts —
  # the systolic constant-critical-path claim, validated by measurement.
  # Resources match across parts (K=128 differs by 10 LUT); timing does
