    _target_: dau_core.exp_generator.ExpTileGenerator
    datapath:
      _target_: dau_core.fixed_point.ExpDatapath
      internal_bits: 52
      table_bits: 8
      degree: 4
      round_steps: false
  # Measured 2026-08-09 via dau-build task=tasks/build/synthesize-cores, which
  # renders the generated source before staging it.
  #
  # 50 DSP48s -- the first tile in the palette to spend any.
  #
  # STILL SHORT OF 125 MHz: this point is a 100 MHz component and its 8 ns
  # measurement is recorded VIOLATED rather than omitted. The lighter point
  # does meet 8 ns, so the gap here is the wider datapath, not the structure.
  #
  # Timing was chased with the REPORT, after three changes moved WNS by
  # exactly nothing (splitting the final scale, splitting the table read, and
  # registering the k product were all tried and reverted). Every real gain
  # came from the same shape: a DSP48's clock-to-out is ~3.5 ns, so any carry
  # chain sitting combinationally between two DSPs overruns 8 ns. Registering
  # the shifted ln2 product and narrowing the reduction constant to 12 bits
  # took 8 ns WNS from -4.819 to -0.909.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {}
      lut: 1329
      ff: 1171
      bram36: 1.0
      dsp: 50
      timing: violated
      wns_ns: -0.909
    - part: xc7a200tfbg484-2
      clock_ns: 10.0
      params: {}
      lut: 1329
      ff: 1171
      bram36: 1.0
      dsp: 50
