  parameters:
    IN_WIDTH:
      default: 512
      choices:
      - 128
      - 256
      - 512
    NUM_PARTITIONS:
      default: 8
  # Measured 2026-08-16 via dau-build task=tasks/build/synthesize-cores, both
  # parts, 8 ns, at the declared defaults (IN_WIDTH=512, NUM_PARTITIONS=8).
  # This tile was the palette's one unpriced operator, so nothing could
  # price a design containing it; that is now closed.
  #
  # The shape is FF-dominated and LUT-light, which is what a positional
  # router should look like: eight lanes each holding a two-word row in a
  # skid plus an emit register is 8 x (4 x 64) bits of storage, and the only
  # combinational work is the PAD compare and the round-robin select. Zero
  # BRAM by construction -- no lane buffers rows, it holds exactly one.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {IN_WIDTH: 512, NUM_PARTITIONS: 8}
      lut: 763
      ff: 2101
