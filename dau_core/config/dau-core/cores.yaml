int32-asof-backward:
  _target_: dau_core.cores.CoreDefinition
  name: int32-asof-backward
  kind: operator
  module: dau_int32_asof_backward
  source: dau_int32_asof_backward.sv
  description: 'Generic keyed backward as-of join: over one host-merged (key, time)-sorted stream of BUILD and PROBE records
    (build-before-probe at equal key/time), attaches to each probe the most recent build for the same key with build_time
    <= probe_time, optionally within cfg_tolerance on the time axis. Each 3-word record is w0={rec_type, key} (rec_type
    bit0: 0=build/1=probe), w1=time[63:0], w2={payload_b, payload_a} (two opaque INT32 fields); because the stream is key-grouped
    the tile holds ONE current build, reset on key change (the key-change shape) — bounded state, one pass, no per-key table.
    A matched probe emits a 4-word joined row (time, {probe_a, key}, {build_b, build_a}, {_, probe_b}); a miss (no live
    build, or older than tolerance) drops, so the tile realizes matched joins only. The temporal-finance backward as-of
    is this join with quote=build {bid, ask}, trade=probe {price, size}, key=symbol — the finance vocabulary lives in the
    host merge, not the tile. A record torn by input_last before its third word is ERR_STREAM.'
  golden: dau_core.operators:keyed_asof_join_rows
  bench: dau_core.tests.cocotb_benches.dau_int32_asof_backward_tb
  # OOC xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +1.679)
  resources:
    lut: 606
    ff: 856
    bram36: 0.0
    dsp: 0
  count_port: match_count
  contract_kind: row-stream
  record_words: 3
  output_record_words: 4
  # static bound: 3-word record ingest + 4-word joined-row emit + drain beat per match; a bench-measured tighter floor may raise it
  ingest:
    rows: 1
    per_cycles: 8
  success_close_out: true

int32-rolling-moments:
  _target_: dau_core.cores.CoreDefinition
  name: int32-rolling-moments
  kind: operator
  module: dau_int32_rolling_moments
  source: dau_int32_rolling_moments.sv
  description: Per-symbol rolling-moment tile (the roll stage of the temporal workflow, over the reduced bar/feature stream).
    Over a count-based window of the last WINDOW values per symbol, emits the deferred-division moment record (count, sum,
    sum-of-squares) for every FULL window — one tile serving rolling sum (=sum), mean (=sum/count) and sample variance (=(count*sum_sq
    - sum*sum)/(count*(count-1)), the host dividing once). One 32-bit value per row (w0 = {value, symbol}); because the
    host-sorted stream is symbol-grouped the tile holds ONE window (a depth-WINDOW shift register) reset on symbol change
    — the bar tile's key-change shape, no per-symbol table. Warm-up rows (window not yet full) are dropped, matching the
    None entries of dau_core.temporal.rolling_moments/rolling_sum. The moment update pipelines over four beats (READ->MUL->DIFF->UPDATE)
    keeping the 32x32 DSP products and the difference/accumulate off one path; one record is buffered so the final emitted
    record carries output_last. WINDOW >= 2 (a size-1 sample variance is undefined; the compiler residues it).
  golden: dau_core.temporal:rolling_moments
  bench: dau_core.tests.cocotb_benches.dau_int32_rolling_moments_tb
  # OOC WINDOW=4 xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +3.155)
  resources:
    lut: 683
    ff: 1001
    bram36: 0.0
    dsp: 8
  count_port: moment_count
  contract_kind: row-stream
  record_words: 1
  output_record_words: 3
  # static FSM bound: 4-beat moment update + 3-word record emit + drain beat per full-window row; a bench-measured tighter floor may raise it
  ingest:
    rows: 1
    per_cycles: 8
  success_close_out: true
  parameters:
    WINDOW:
      default: 4
      minimum: 2

int32-market-feature:
  _target_: dau_core.cores.CoreDefinition
  name: int32-market-feature
  kind: operator
  module: dau_int32_market_feature
  source: dau_int32_market_feature.sv
  description: 'Market-feature map (the derive stage of the temporal workflow): a stateless per-row map from an aligned
    market row (as-of tile output, 4 words: time, {price, symbol}, {ask, bid}, {_, size}) to a 7-word feature record — midpoint
    = (bid+ask)>>1 (33-bit sum, no int32 overflow), spread = ask-bid (INT64, the int32 range can overflow), quote-rule trade_sign
    (+1 above midpoint / -1 below / 0 at), signed_volume = trade_sign*size (INT64), dollar_volume = price*size (INT64, the
    VWAP numerator). One output row per input row; matches dau_core.temporal.market_features. In the fused datapath this
    is a chain stage between the as-of tile and the bar tile — its signed_volume is the value the bar tile accumulates.
    A row torn by input_last before its fourth word is ERR_STREAM.'
  golden: dau_core.temporal:market_features
  bench: dau_core.tests.cocotb_benches.dau_int32_market_feature_tb
  # OOC xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +0.680)
  resources:
    lut: 480
    ff: 528
    bram36: 0.0
    dsp: 4
  count_port: feature_count
  contract_kind: row-stream
  record_words: 4
  output_record_words: 7
  # static bound: 7 output words per input row gate the 64-bit stream; a bench-measured tighter floor may raise it
  ingest:
    rows: 1
    per_cycles: 7
  success_close_out: true

int32-time-bucket-key:
  _target_: dau_core.cores.CoreDefinition
  name: int32-time-bucket-key
  kind: operator
  module: dau_int32_time_bucket_key
  source: dau_int32_time_bucket_key.sv
  description: 'Generic time-bucket key rewrite: replaces a row''s partition key with a composite (partition, time-bucket)
    group key so a downstream key-grouped aggregator (bar / grouped-sum) produces fixed-width TIME-WINDOWED groups per partition
    — workload-agnostic (finance time bars, TSBS window shapes, ...); the aggregation and any per-row derivation stay in
    their own tiles. bucket = time >>> cfg_bucket_shift (window = 2**shift); key = {partition[PART_BITS-1:0], bucket[BUCKET_BITS-1:0]}
    (PART_BITS = 32 - BUCKET_BITS) so it changes exactly on a partition-or-bucket boundary (the stream is pre-sorted by
    (partition, time)); the downstream recovers partition = key >>> BUCKET_BITS. Contract: the partition id fits PART_BITS
    bits and the host-rebased bucket fits BUCKET_BITS, so they never collide — ENFORCED by the tile (a partition or bucket
    that overflows its width is ERR_RANGE, never a silent alias). A mid-lane transform: silent on success (1:1 rows, output_last
    rides the last row), status on a torn row (ERR_STREAM) or an out-of-range key (ERR_RANGE); payload passes through.'
  golden: dau_core.operators:time_bucket_key_rows
  bench: dau_core.tests.cocotb_benches.dau_int32_time_bucket_key_tb
  # OOC BUCKET_BITS=16 xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +2.175)
  resources:
    lut: 291
    ff: 305
    bram36: 0.0
    dsp: 0
  contract_kind: row-stream
  record_words: 3
  output_record_words: 2
  # bench measured 256 rows / 1788 cycles = 6.98 cycles/row (2026-07-31)
  ingest:
    rows: 1
    per_cycles: 7
  parameters:
    BUCKET_BITS:
      default: 16
      maximum: 31

int32-record-gather:
  _target_: dau_core.cores.CoreDefinition
  name: int32-record-gather
  kind: operator
  module: dau_int32_record_gather
  source: dau_int32_record_gather.sv
  description: 'Generic fixed-record gather: consumes one IN_WORDS-word record and emits one OUT_WORDS-word record assembled
    from independently selected 32-bit halves. Each cfg_sel packs source word [5:0], source half [6], logical right shift
    [11:7], and zero-only reserved bits [31:12]. Config latches on the first word of a batch; invalid config drains the batch
    then reports ERR_CONFIG, and input_last before a record final word reports ERR_STREAM. A mid-lane transform: 1:1 records,
    output_last rides the emitted record final word, and success is silent.'
  golden: dau_core.operators:gather_records
  bench: dau_core.tests.cocotb_benches.dau_int32_record_gather_tb
  resources:
    lut: 291
    ff: 305
    bram36: 0.0
    dsp: 0
  contract_kind: row-stream
  record_words_param: IN_WORDS
  output_record_words_param: OUT_WORDS
  # one record per IN_WORDS read beats + OUT_WORDS emit beats; default cadence is 4 + 1 = 5 cycles
  ingest:
    rows: 1
    per_cycles: 5
  parameters:
    IN_WORDS:
      default: 4
      maximum: 64
    OUT_WORDS:
      default: 1
      maximum: 8

int32-hash-grouped-aggregation:
  _target_: dau_core.cores.CoreDefinition
  name: int32-hash-grouped-aggregation
  kind: operator
  module: dau_int32_hash_grouped_aggregation
  source: dau_int32_hash_grouped_aggregation.sv
  description: 'Hash-mode grouped field-sum aggregation over quad rows: one INT64 accumulator set per DISTINCT key
    in a CAPACITY-slot table, drained signed-key ASCENDING at close-out. Where int32-grouped-field-sum-aggregation
    groups CONSECUTIVE equal keys — needing the staged table pre-sorted on the group key, and opening a second
    partial whenever a key reappears — this tile holds per-key state, so input order does not matter and a key may
    reappear anywhere in the batch: one record per distinct key, always. That removes the sorted_by_key staging
    precondition from every grouped scan. Hash (low key bits) + linear probe over a {sums[3:0], count, key} BRAM
    with a separate valid array; deliberately SEQUENTIAL (one row in flight), so no read-modify-write hazard
    exists. All four field sums accumulate unconditionally — the accumulate path is config-free and cfg_field_mask
    selects only which sums the drain emits, so the record shape matches the ordered tile word-for-word (shared
    host decode). The ascending drain is a CONTRACT, not an implementation detail: a hash table has no intrinsic
    order, so leaking probe order would make results depend on the hash function. Overflow (a new key with the
    table full) is GROUP_CAPACITY_EXCEEDED and invalidates the batch — never an eviction; the host recovers by
    key-range split and merge (dau_core.operators.merge_hash_grouped is exact because INT64 sums and counts are
    additive per key). State is fresh per batch: the CLEAR sweep runs from both reset and close-out. A zero mask
    is BAD_FIELD_MASK; input_last on a quad row w0 is BAD_STREAM. Matches
    dau_core.operators.hash_grouped_field_sum_rows.'
  golden: dau_core.operators:hash_grouped_field_sum_rows
  bench: dau_core.tests.cocotb_benches.dau_int32_hash_grouped_aggregation_tb
  # Measured 2026-08-06 via synthesize-cores at {256, 512, 1024} on both
  # parts, all met. LUT/FF are nearly flat in CAPACITY (the datapath is one
  # row and four 64-bit accumulators; only the address/probe counters widen),
  # while BRAM steps 4.5 -> 9.0 at 1024: the 320-bit slot spans multiple
  # RAMB36 and the depth crosses their 512-deep boundary. The Artix margin is
  # the tightest in the palette at +0.410 -- the 320-bit registered read plus
  # the signed-minimum fold is the critical path, so a wider slot or a deeper
  # table wants a retime before it closes.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {CAPACITY: 256}
      lut: 733
      ff: 864
      bram36: 4.5
      dsp: 0
      timing: met
      wns_ns: 0.41
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {CAPACITY: 512}
      lut: 758
      ff: 868
      bram36: 4.5
      dsp: 0
      timing: met
      wns_ns: 0.41
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {CAPACITY: 1024}
      lut: 846
      ff: 871
      bram36: 9.0
      dsp: 0
      timing: met
      wns_ns: 0.413
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {CAPACITY: 256}
      lut: 733
      ff: 864
      bram36: 4.5
      dsp: 0
      timing: met
      wns_ns: 2.736
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {CAPACITY: 512}
      lut: 757
      ff: 868
      bram36: 4.5
      dsp: 0
      timing: met
      wns_ns: 2.736
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {CAPACITY: 1024}
      lut: 843
      ff: 868
      bram36: 9.0
      dsp: 0
      timing: met
      wns_ns: 2.391
  count_port: group_count
  contract_kind: row-stream
  record_words: 2
  # SUM + COUNT over INT32 inputs, per group — the same advertisement the
  # ordered sibling makes, so a composition built only from this tile is
  # discoverable by the planner rather than reporting an empty bitmap
  opcodes:
  - 3
  - 4
  opcode_input_types:
  - 12
  unit_kind: aggregation
  # the mask selects how many sum words ride each record (key + 1..4 sums +
  # count), exactly like the ordered tile
  output_record_words_variable: true
  ingest:
    rows: 1
    # the zero-collision cadence: W0+W1+PROBE+JUDGE = 4 cycles/row.
    # Acceptance for probe depth p is 2p+2, so the STATED ASSUMPTION is
    # hash-distributed keys at low load factor (p ~= 1); two resident keys
    # congruent modulo CAPACITY already cost 6, and adversarial congruent
    # fills degrade to 1/(2*CAPACITY+2) — a planner-regime concern per the
    # IngestRate doctrine, visible here rather than hidden behind a padded
    # number (the keyed-state precedent). The key-ascending DRAIN is a
    # further O(CAPACITY x live groups) paid once per batch at close-out,
    # outside the per-row cadence like every terminal's record emission.
    per_cycles: 4
  success_close_out: true
  parameters:
    CAPACITY:
      default: 512
      maximum: 1024
  storage_intent:
    - role: group_table
      access: owned
      bytes_per_unit: 40
      scale_parameter: CAPACITY
      tier_hint: bram

int32-streaming-top-k:
  _target_: dau_core.cores.CoreDefinition
  name: int32-streaming-top-k
  kind: operator
  module: dau_int32_streaming_top_k
  source: dau_int32_streaming_top_k.sv
  description: 'Streaming top-k tile (ORDER BY <key> DESC LIMIT K): over quad rows (key, v0, v1, v2) keeps the K rows with
    the largest signed-INT32 sort key (field 0), ties by arrival (earliest wins), and at close-out drains them sorted key-descending
    — the q3/q10 and TSBS group-by-order-by-limit shape. The retained set lives in a size-K systolic sorted register array
    where every cell makes a LOCAL compare-and-shift decision (constant critical path regardless of K, one row every two
    cycles); physical position encodes arrival order so equal-key ties resolve for free (a later row inserts after an earlier
    equal key via a strict < compare) with no arrival counter. A row inserts iff some cell is empty or its key is strictly
    less than the arriving key. Matches dau_core.operators.streaming_top_k. K is compile-time (the host/compiler validates
    K in [1, 128] = dau_core.operators.TOP_K_MAX, BAD_K at composition time), enforced by an elaboration guard. A row torn
    by input_last on w0 is ERR_STREAM.'
  golden: dau_core.operators:streaming_top_k
  bench: dau_core.tests.cocotb_benches.dau_int32_streaming_top_k_tb
  # Full K surface on one unchanged source, measured via synthesize-cores
  # (2026-08-04 sweep): K in {1, 5, 8, 16, 32, 64, 128} x both parts. LUT
  # scales linearly (~152/cell) and WNS is flat across K on both parts —
  # the systolic constant-critical-path claim, validated by measurement.
  # Resources match across parts (K=128 differs by 10 LUT); timing does
  # not, which is the whole reason a point carries its part. K=5 is the
  # TSBS group-by-order-by-limit LIMIT.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {K: 1}
      lut: 109
      ff: 268
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 4.362
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {K: 5}
      lut: 843
      ff: 800
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 4.350
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {K: 8}
      lut: 1295
      ff: 1196
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 4.350
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {K: 16}
