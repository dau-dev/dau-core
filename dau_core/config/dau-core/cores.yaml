  source: dau_scratchpad.sv
  description: 'Owned-arena scratchpad: the deliberately trivial consumer of the
    owned storage class (STORAGE_AND_NOC.md). A granted word arena behind a
    host-written config port an allocator tile drives later; overflow at the
    grant boundary is a defined STORAGE_OVERFLOW close-out preserving
    emitted rows. Two words in per row {value,addr}/{we}, one word out
    {post_op_value,addr}. The interface keyed state consumes next.'
  golden: dau_core.operators:scratchpad_scan
  bench: dau_core.tests.cocotb_benches.dau_scratchpad_tb
  count_port: row_count
  contract_kind: row-stream
