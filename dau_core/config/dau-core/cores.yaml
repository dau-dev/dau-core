key-membership-filter:
  _target_: dau_core.cores.CoreDefinition
  name: key-membership-filter
  kind: operator
  module: dau_key_membership_filter
  source: dau_key_membership_filter.sv
  description: 'Key-set membership filter over 16-byte quad rows: the join tier''s entry. A build set is loaded into an
    exact direct-mapped bitmap (BRAM) in a load phase (the two-phase membership job), then whole rows keep/drop by whether
    the row key (w0.lo) is a member; cfg_mode selects semi (keep members: IN / semi-join / distinct-probe) vs anti (keep
    non-members: NOT IN / anti-join). Exact — no false positives (bloom is a reserved future kind).'
  golden: dau_core.operators:filter_rows_by_membership
  bench: dau_core.tests.cocotb_benches.dau_key_membership_filter_tb
  # OOC KEY_SPACE=4096; bitmap is one RAMB36, 8 ns met
  # Measured 2026-08-11 via dau-build task=tasks/build/synthesize-cores.
  #
  # A KEY_SPACE LADDER, measured 2026-08-17 on the same task, because two
  # points do not price a dimension. The compiler sizes KEY_SPACE from the
  # key dictionary, so a tile priced only at 4096 and 6000000 is reachable
  # from no real table: every cardinality between them refused as unmeasured.
  # The rungs at 2^17, 2^19 and 2^21 make the whole range priceable by
  # rounding a dictionary UP to the next measured rung -- sound, because a
  # larger bitmap holds the same set.
  #
  # The cost law the ladder states: ONE RAMB36 per 32,768 bits (512 words of
  # 64), so bram36 = KEY_SPACE / 32768, exactly linear. It is the cheapest
  # per key of anything in the registry -- one bit per key -- which is why
  # every TPC-H SF1 table fits: lineitem's 6M keys place 192 of the Artix's
  # 335 budgeted BRAM36, and the 1.5M-key orders rung below it places 64.
  # LUT is NOT monotone in KEY_SPACE (488 at 2^17, 444 at 2^19): the output
  # mux over the BRAM array restructures with the array's shape.
  # Both parts meet 8 ns at every rung.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 4096, KEY_WIDTH: int32}
      lut: 425
      ff: 552
      bram36: 1.0
      dsp: 0
      timing: met
      wns_ns: 2.132
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 4096, KEY_WIDTH: int32}
      lut: 425
      ff: 552
      bram36: 1.0
      dsp: 0
      timing: met
      wns_ns: 3.788
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 131072, KEY_WIDTH: int32}
      lut: 488
      ff: 558
      bram36: 4.0
      dsp: 0
      timing: met
      wns_ns: 1.579
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 131072, KEY_WIDTH: int32}
      lut: 488
      ff: 558
      bram36: 4.0
      dsp: 0
      timing: met
      wns_ns: 3.312
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 524288, KEY_WIDTH: int32}
      lut: 444
      ff: 560
      bram36: 16.0
      dsp: 0
      timing: met
      wns_ns: 2.280
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 524288, KEY_WIDTH: int32}
      lut: 438
      ff: 560
      bram36: 16.0
      dsp: 0
      timing: met
      wns_ns: 3.838
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 2097152, KEY_WIDTH: int32}
      lut: 584
      ff: 570
      bram36: 64.0
      dsp: 0
      timing: met
      wns_ns: 2.064
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 2097152, KEY_WIDTH: int32}
      lut: 552
      ff: 562
      bram36: 64.0
      dsp: 0
      timing: met
      wns_ns: 3.737
    # KEY_SPACE=6000000 is the configuration proven on silicon, and the
    # reason a scalar envelope was not good enough: this tile is a BITMAP,
    # so its BRAM cost is the key space. The retired scalar declared
    # bram36 1.0 for every KEY_SPACE, pricing this build at 1/192 of what
    # it actually places -- 192 of the Artix's 335 budgeted BRAM36.
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 6000000, KEY_WIDTH: int32}
      lut: 848
      ff: 632
      bram36: 192.0
      dsp: 0
      timing: met
      wns_ns: 1.930
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 6000000, KEY_WIDTH: int32}
      lut: 824
      ff: 632
      bram36: 192.0
      dsp: 0
      timing: met
      wns_ns: 3.830
  count_port: selected_count
  contract_kind: row-stream
  record_words: 2
  ingest:
    rows: 1
    per_cycles: 2
  unit_kind: membership
  load_image: bitmap-64
  parameters:
    KEY_SPACE:
      default: 4096
      multiple_of: 64
    KEY_WIDTH:
      # the ELEMENT TYPE of the probe key lane. The key is a DICTIONARY ID --
      # an index, not a magnitude -- so the range test and the bitmap address
      # run on it zero-extended to 32 bits whatever the lane's width, and it
      # is float that is refused rather than unsigned. A narrower key does not
      # shrink the bitmap: KEY_SPACE does that. int32 encodes as 32, so this
      # declares exactly the tile it always built.
      element_type: true
      default: int32
      # {value, key} tile one 64-bit stream word
      minimum: 8
      maximum: 32
      # only int32 is MEASURED; the RTL elaborates the whole declared range
      choices: [int32]

streaming-dedup:
  _target_: dau_core.cores.CoreDefinition
  name: streaming-dedup
  kind: operator
  module: dau_streaming_dedup
  source: dau_streaming_dedup.sv
  description: 'Streaming insert-on-probe dedup over 16-byte quad rows: COUNT(DISTINCT key) on the device. The row key
    (w0.lo) indexes a direct-mapped bitmap over [0, KEY_SPACE); a row whose bit is clear sets it and counts, a row whose
    bit is set changes nothing. No rows are forwarded — the batch closes out with ONE 64-bit word, the distinct count, so
    N keys cross the bus inbound and one number crosses it back. The membership filter is the static sibling (loaded once,
    probed read-only); writing the bitmap while probing is what a distinct needs and what that tile cannot do, and it costs
    a read-modify-write whose read-during-write collision on repeated keys is closed by forwarding the in-flight write. The
    bitmap survives batch boundaries so an overlapped multi-batch scan is ONE dedup (per-batch counts are not summable);
    cfg_clear, sampled at a batch''s first word, starts a fresh accumulation. Sized by CARDINALITY, not row count. An
    out-of-range key is ERR_RANGE rather than a miss: a dedup cannot record it and wrapping would merge two keys into one
    count.'
  golden: dau_core.operators:count_distinct_rows
  bench: dau_core.tests.cocotb_benches.dau_streaming_dedup_tb
  # Measured 2026-08-14 via dau-build task=tasks/build/synthesize-cores, both
  # parts, at the default KEY_SPACE and at the 1.5M-distinct point the screen
  # was argued on. Two corrections to that screen, both from measurement:
  # the tile is far LEANER than the ~700 LUT it was priced at (268 at 4096,
  # 421 at 1.5M -- it forwards no rows, so there is no emit engine or skid
  # slot), and its bitmap costs MORE BRAM than the bit count suggests. 1.5M
  # bits is 40.7 RAMB36 of raw capacity but the memory is 23,438 words of 64
  # bits, and a RAMB36 in 64-bit mode holds 512 words, so the array rounds up
  # to 64 -- still 19% of the Artix's 335 budget. Timing meets 8 ns on both
  # parts at both sizes, including across the forwarded read-modify-write
  # path at the 64-BRAM output mux.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 4096, KEY_WIDTH: int32}
      lut: 268
      ff: 299
      bram36: 1.0
      dsp: 0
      timing: met
      wns_ns: 3.816
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 4096, KEY_WIDTH: int32}
      lut: 268
      ff: 299
      bram36: 1.0
      dsp: 0
      timing: met
      wns_ns: 5.173
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 1500032, KEY_WIDTH: int32}
      lut: 421
      ff: 326
      bram36: 64.0
      dsp: 0
      timing: met
      wns_ns: 3.846
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 1500032, KEY_WIDTH: int32}
      lut: 389
      ff: 326
      bram36: 64.0
      dsp: 0
      timing: met
      wns_ns: 5.235
  count_port: distinct_count
  contract_kind: row-stream
  record_words: 2
  output_record_words: 1
  ingest:
    rows: 1
    per_cycles: 2
  # no unit_kind: the design inventory has no dedup unit, and borrowing
  # `membership` would advertise semi/anti filtering this tile cannot do while
  # `aggregation` would advertise capacity for opcodes it does not execute.
  success_close_out: true
  parameters:
    KEY_SPACE:
      default: 4096
      minimum: 64
      maximum: 8388608
      multiple_of: 64
    KEY_WIDTH:
      # the ELEMENT TYPE of the key lane -- the only lane this tile reads. The
      # key is a DICTIONARY ID, an index rather than a magnitude, so the range
      # test is one unsigned compare either way and the tile's own guard
      # refuses only float. A narrower type does NOT shrink the bitmap:
      # KEY_SPACE sizes that, and cardinality sizes KEY_SPACE. int32 encodes
      # as 32, so this declares exactly the tile it always built.
      element_type: true
      default: int32
      minimum: 8
      maximum: 32
      choices: [int32]

broadcast-hash-join:
  _target_: dau_core.cores.CoreDefinition
  name: broadcast-hash-join
  kind: operator
  module: dau_broadcast_hash_join
  source: dau_broadcast_hash_join.sv
  description: 'Broadcast hash join over 16-byte quad rows: the join tier''s payload-emitting Joiner (the q3 join spine).
    A build side (key, b0, b1, b2) is broadcast into a direct-mapped payload table (BRAM) in a load phase (the two-phase
    join job), then probe rows (key, v0, v1, v2) inner-join against it — a hit emits one (key, out0, out1, out2) row whose
    data fields are chosen per cfg_out{0,1,2}_sel from the six sources {b0,b1,b2,v0,v1,v2}, a miss drops. Last-writer-wins
    on a duplicate build key; a build/probe key outside [0, KEY_SPACE) is ERR_RANGE.'
  golden: dau_core.operators:broadcast_hash_join_rows
  bench: dau_core.tests.cocotb_benches.dau_broadcast_hash_join_tb
  # OOC KEY_SPACE=1024; payload table is 3 RAMB36, 8 ns met (WNS +3.421)
  # Measured 2026-08-11 via dau-build task=tasks/build/synthesize-cores.
  #
  # A KEY_SPACE LADDER, measured 2026-08-17 on the same task, to answer the
  # question one point could not: how big a dimension can this tile join.
  #
  # The cost law, and the whole difference from the membership bitmap: this
  # table stores a 97-bit SLOT per key ({valid, b0, b1, b2}), not one bit,
  # and Vivado builds it as one memory bit per block. Above 1024 that is
  # exactly 97 RAMB36 per 32,768 slots -- 48.5 tiles at 2^14 (97 RAMB18),
  # 97 at 2^15, 194 at 2^16, 388 at 2^17. Per key it costs 97x the
  # membership filter, and that ratio IS the join tier's ceiling.
  #
  # THE CEILING, stated per part so it does not have to be re-derived:
  #   * dpv1 (xc7a200t, 335 budgeted of 365 on the part): the largest rung
  #     that fits is 65,536 keys at 194 BRAM36 (58% of budget). 2^17 places
  #     388, which is 106.3% of the PART -- synthesizable, unplaceable. The
  #     budget's true maximum is 335/97 * 32768 = 113,154 keys.
  #   * dpv2 (xc7k325t, 415 budgeted of 445): 2^17 fits at 388 (93.5% of
  #     budget, 87.2% of part) but leaves 27 BRAM36 for the rest of the
  #     composition. True maximum 415/97 * 32768 = 140,190 keys.
  # Against TPC-H SF1 that puts supplier (10K) inside the ceiling on both
  # boards and customer (150K) outside it on both -- by 7% on dpv2. The
  # 2^17 point is recorded ANYWAY, over-budget on dpv1, so the planner
  # refuses it by arithmetic against a measured number instead of refusing
  # it as unmeasured. Both parts meet 8 ns at every rung.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 1024, FIELD_WIDTH: int32}
      lut: 708
      ff: 423
      bram36: 3.0
      dsp: 0
      timing: met
      wns_ns: 3.857
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 1024, FIELD_WIDTH: int32}
      lut: 708
      ff: 423
      bram36: 3.0
      dsp: 0
      timing: met
      wns_ns: 4.651
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 16384, FIELD_WIDTH: int32}
      lut: 797
      ff: 427
      bram36: 48.5
      dsp: 0
      timing: met
      wns_ns: 3.857
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 16384, FIELD_WIDTH: int32}
      lut: 782
      ff: 427
      bram36: 48.5
      dsp: 0
      timing: met
      wns_ns: 4.728
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 32768, FIELD_WIDTH: int32}
      lut: 890
      ff: 429
      bram36: 97.0
      dsp: 0
      timing: met
      wns_ns: 3.808
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 32768, FIELD_WIDTH: int32}
      lut: 860
      ff: 429
      bram36: 97.0
      dsp: 0
      timing: met
      wns_ns: 4.684
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 65536, FIELD_WIDTH: int32}
      lut: 1076
      ff: 430
      bram36: 194.0
      dsp: 0
      timing: met
      wns_ns: 2.788
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 65536, FIELD_WIDTH: int32}
      lut: 1071
      ff: 430
      bram36: 194.0
      dsp: 0
      timing: met
      wns_ns: 3.852
    # 388 BRAM36: over the dpv1 BUDGET and over the xc7a200t PART (106.3%).
    # Recorded so the refusal is priced rather than unmeasured; it is a
    # dpv2-only point.
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 131072, FIELD_WIDTH: int32}
      lut: 1993
      ff: 426
      bram36: 388.0
      dsp: 0
      timing: met
      wns_ns: 2.696
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 131072, FIELD_WIDTH: int32}
      lut: 1988
      ff: 426
      bram36: 388.0
      dsp: 0
      timing: met
      wns_ns: 3.722
  count_port: joined_count
  contract_kind: row-stream
  record_words: 2
  ingest:
    rows: 1
    per_cycles: 2
  unit_kind: join
  load_image: quad-rows
  parameters:
    KEY_SPACE:
      default: 1024
    FIELD_WIDTH:
      # the ELEMENT TYPE of one lane, on the way in and in the joined row on
      # the way out. int32 encodes as 32, so this declares exactly the tile
      # that has always been built.
      #
      # THE SLOT IS {valid, b2, b1, b0}, so unlike the accumulator tiles this
      # one's BRAM cost moves DIRECTLY with the element: every offered type is
      # its own measured point at every KEY_SPACE rung.
      element_type: true
      default: int32
      minimum: 8
      maximum: 32
      # only int32 is MEASURED; the RTL elaborates the whole declared range
      choices: [int32]
