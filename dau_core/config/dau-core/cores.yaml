int32-asof-backward:
  _target_: dau_core.cores.CoreDefinition
  name: int32-asof-backward
  kind: operator
  module: dau_int32_asof_backward
  source: dau_int32_asof_backward.sv
  description: 'Generic keyed backward as-of join: over one host-merged (key, time)-sorted stream of BUILD and PROBE records
    (build-before-probe at equal key/time), attaches to each probe the most recent build for the same key with build_time
    <= probe_time, optionally within cfg_tolerance on the time axis. Each 3-word record is w0={rec_type, key} (rec_type
    bit0: 0=build/1=probe), w1=time[63:0], w2={payload_b, payload_a} (two opaque INT32 fields); because the stream is key-grouped
    the tile holds ONE current build, reset on key change (the key-change shape) — bounded state, one pass, no per-key table.
    A matched probe emits a 4-word joined row (time, {probe_a, key}, {build_b, build_a}, {_, probe_b}); a miss (no live
    build, or older than tolerance) drops, so the tile realizes matched joins only. The temporal-finance backward as-of
    is this join with quote=build {bid, ask}, trade=probe {price, size}, key=symbol — the finance vocabulary lives in the
    host merge, not the tile. A record torn by input_last before its third word is ERR_STREAM.'
  golden: dau_core.operators:keyed_asof_join_rows
  bench: dau_core.tests.cocotb_benches.dau_int32_asof_backward_tb
  # OOC xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +1.679)
  resources:
    lut: 606
    ff: 856
    bram36: 0.0
    dsp: 0
  count_port: match_count
  contract_kind: row-stream
  success_close_out: true

int32-rolling-moments:
  _target_: dau_core.cores.CoreDefinition
  name: int32-rolling-moments
  kind: operator
  module: dau_int32_rolling_moments
  source: dau_int32_rolling_moments.sv
  description: Per-symbol rolling-moment tile (the roll stage of the temporal workflow, over the reduced bar/feature stream).
    Over a count-based window of the last WINDOW values per symbol, emits the deferred-division moment record (count, sum,
    sum-of-squares) for every FULL window — one tile serving rolling sum (=sum), mean (=sum/count) and sample variance (=(count*sum_sq
    - sum*sum)/(count*(count-1)), the host dividing once). One 32-bit value per row (w0 = {value, symbol}); because the
    host-sorted stream is symbol-grouped the tile holds ONE window (a depth-WINDOW shift register) reset on symbol change
    — the bar tile's key-change shape, no per-symbol table. Warm-up rows (window not yet full) are dropped, matching the
    None entries of dau_core.temporal.rolling_moments/rolling_sum. The moment update pipelines over four beats (READ->MUL->DIFF->UPDATE)
    keeping the 32x32 DSP products and the difference/accumulate off one path; one record is buffered so the final emitted
    record carries output_last. WINDOW >= 2 (a size-1 sample variance is undefined; the compiler residues it).
  golden: dau_core.temporal:rolling_moments
  bench: dau_core.tests.cocotb_benches.dau_int32_rolling_moments_tb
  # OOC WINDOW=4 xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +3.155)
  resources:
    lut: 683
    ff: 1001
    bram36: 0.0
    dsp: 8
  count_port: moment_count
  contract_kind: row-stream
  success_close_out: true
  parameters:
    WINDOW:
      default: 4
      minimum: 2

int32-market-feature:
  _target_: dau_core.cores.CoreDefinition
  name: int32-market-feature
  kind: operator
  module: dau_int32_market_feature
  source: dau_int32_market_feature.sv
  description: 'Market-feature map (the derive stage of the temporal workflow): a stateless per-row map from an aligned
    market row (as-of tile output, 4 words: time, {price, symbol}, {ask, bid}, {_, size}) to a 7-word feature record — midpoint
    = (bid+ask)>>1 (33-bit sum, no int32 overflow), spread = ask-bid (INT64, the int32 range can overflow), quote-rule trade_sign
    (+1 above midpoint / -1 below / 0 at), signed_volume = trade_sign*size (INT64), dollar_volume = price*size (INT64, the
    VWAP numerator). One output row per input row; matches dau_core.temporal.market_features. In the fused datapath this
    is a chain stage between the as-of tile and the bar tile — its signed_volume is the value the bar tile accumulates.
    A row torn by input_last before its fourth word is ERR_STREAM.'
  golden: dau_core.temporal:market_features
  bench: dau_core.tests.cocotb_benches.dau_int32_market_feature_tb
  # OOC xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +0.680)
  resources:
    lut: 480
    ff: 528
    bram36: 0.0
    dsp: 4
  count_port: feature_count
  contract_kind: row-stream
  success_close_out: true

int32-time-bucket-key:
  _target_: dau_core.cores.CoreDefinition
  name: int32-time-bucket-key
  kind: operator
  module: dau_int32_time_bucket_key
  source: dau_int32_time_bucket_key.sv
  description: 'Generic time-bucket key rewrite: replaces a row''s partition key with a composite (partition, time-bucket)
    group key so a downstream key-grouped aggregator (bar / grouped-sum) produces fixed-width TIME-WINDOWED groups per partition
    — workload-agnostic (finance time bars, TSBS window shapes, ...); the aggregation and any per-row derivation stay in
    their own tiles. bucket = time >>> cfg_bucket_shift (window = 2**shift); key = {partition[PART_BITS-1:0], bucket[BUCKET_BITS-1:0]}
    (PART_BITS = 32 - BUCKET_BITS) so it changes exactly on a partition-or-bucket boundary (the stream is pre-sorted by
    (partition, time)); the downstream recovers partition = key >>> BUCKET_BITS. Contract: the partition id fits PART_BITS
    bits and the host-rebased bucket fits BUCKET_BITS, so they never collide — ENFORCED by the tile (a partition or bucket
    that overflows its width is ERR_RANGE, never a silent alias). A mid-lane transform: silent on success (1:1 rows, output_last
    rides the last row), status on a torn row (ERR_STREAM) or an out-of-range key (ERR_RANGE); payload passes through.'
  golden: dau_core.operators:time_bucket_key_rows
  bench: dau_core.tests.cocotb_benches.dau_int32_time_bucket_key_tb
  # OOC BUCKET_BITS=16 xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +2.175)
  resources:
    lut: 291
    ff: 305
    bram36: 0.0
    dsp: 0
  contract_kind: row-stream
  parameters:
    BUCKET_BITS:
      default: 16
      maximum: 31

int32-streaming-top-k:
  _target_: dau_core.cores.CoreDefinition
  name: int32-streaming-top-k
  kind: operator
  module: dau_int32_streaming_top_k
  source: dau_int32_streaming_top_k.sv
  description: 'Streaming top-k tile (ORDER BY <key> DESC LIMIT K): over quad rows (key, v0, v1, v2) keeps the K rows with
    the largest signed-INT32 sort key (field 0), ties by arrival (earliest wins), and at close-out drains them sorted key-descending
    — the q3/q10 and TSBS group-by-order-by-limit shape. The retained set lives in a size-K systolic sorted register array
    where every cell makes a LOCAL compare-and-shift decision (constant critical path regardless of K, one row every two
    cycles); physical position encodes arrival order so equal-key ties resolve for free (a later row inserts after an earlier
    equal key via a strict < compare) with no arrival counter. A row inserts iff some cell is empty or its key is strictly
    less than the arriving key. Matches dau_core.operators.streaming_top_k. K is compile-time (the host/compiler validates
    K in [1, 128] = dau_core.operators.TOP_K_MAX, BAD_K at composition time), enforced by an elaboration guard. A row torn
    by input_last on w0 is ERR_STREAM.'
  golden: dau_core.operators:streaming_top_k
  bench: dau_core.tests.cocotb_benches.dau_int32_streaming_top_k_tb
  # OOC K=8 xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +4.350)
  resources:
    lut: 1295
    ff: 1196
    bram36: 0.0
    dsp: 0
  count_port: top_count
  contract_kind: row-stream
  success_close_out: true
  parameters:
    K:
      default: 8
      maximum: 128

