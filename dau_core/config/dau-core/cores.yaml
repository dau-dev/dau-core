int32-key-membership-filter:
  _target_: dau_core.cores.CoreDefinition
  name: int32-key-membership-filter
  kind: operator
  module: dau_int32_key_membership_filter
  source: dau_int32_key_membership_filter.sv
  description: 'Key-set membership filter over 16-byte quad rows: the join tier''s entry. A build set is loaded into an
    exact direct-mapped bitmap (BRAM) in a load phase (the two-phase membership job), then whole rows keep/drop by whether
    the row key (w0.lo) is a member; cfg_mode selects semi (keep members: IN / semi-join / distinct-probe) vs anti (keep
    non-members: NOT IN / anti-join). Exact — no false positives (bloom is a reserved future kind).'
  golden: dau_core.operators:filter_rows_by_membership
  bench: dau_core.tests.cocotb_benches.dau_int32_key_membership_filter_tb
  # OOC KEY_SPACE=4096; bitmap is one RAMB36, 8 ns met
  # Measured 2026-08-11 via dau-build task=tasks/build/synthesize-cores.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 4096}
      lut: 425
      ff: 552
      bram36: 1.0
      dsp: 0
      timing: met
      wns_ns: 2.132
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 4096}
      lut: 425
      ff: 552
      bram36: 1.0
      dsp: 0
      timing: met
      wns_ns: 3.788
    # KEY_SPACE=6000000 is the configuration proven on silicon, and the
    # reason a scalar envelope was not good enough: this tile is a BITMAP,
    # so its BRAM cost is the key space. The retired scalar declared
    # bram36 1.0 for every KEY_SPACE, pricing this build at 1/192 of what
    # it actually places -- 192 of the Artix's 335 budgeted BRAM36.
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {KEY_SPACE: 6000000}
      lut: 848
      ff: 632
      bram36: 192.0
      dsp: 0
      timing: met
      wns_ns: 1.930
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {KEY_SPACE: 6000000}
      lut: 824
      ff: 632
      bram36: 192.0
      dsp: 0
      timing: met
      wns_ns: 3.830
  count_port: selected_count
  contract_kind: row-stream
  record_words: 2
  ingest:
    rows: 1
    per_cycles: 2
  unit_kind: membership
  load_image: bitmap-64
  parameters:
    KEY_SPACE:
      default: 4096
      multiple_of: 64

int32-broadcast-hash-join:
  _target_: dau_core.cores.CoreDefinition
  name: int32-broadcast-hash-join
  kind: operator
  module: dau_int32_broadcast_hash_join
  source: dau_int32_broadcast_hash_join.sv
  description: 'Broadcast hash join over 16-byte quad rows: the join tier''s payload-emitting Joiner (the q3 join spine).
    A build side (key, b0, b1, b2) is broadcast into a direct-mapped payload table (BRAM) in a load phase (the two-phase
    join job), then probe rows (key, v0, v1, v2) inner-join against it — a hit emits one (key, out0, out1, out2) row whose
    data fields are chosen per cfg_out{0,1,2}_sel from the six sources {b0,b1,b2,v0,v1,v2}, a miss drops. Last-writer-wins
    on a duplicate build key; a build/probe key outside [0, KEY_SPACE) is ERR_RANGE.'
  golden: dau_core.operators:broadcast_hash_join_rows
  bench: dau_core.tests.cocotb_benches.dau_int32_broadcast_hash_join_tb
  # OOC KEY_SPACE=1024; payload table is 3 RAMB36, 8 ns met (WNS +3.421)
