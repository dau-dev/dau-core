row-unpack:
  _target_: dau_core.cores.CoreDefinition
  name: row-unpack
  kind: operator
  module: dau_row_unpack
  source: dau_row_unpack.sv
  description: 'Row-unpack front-end feed over <=64-bit packed rows: bit-extracts four configured fields (offset/width/signed)
    from one packed word and widens them into the standard 16-byte int32 quad row (field 0 = key = w0.lo) the operator tiles
    consume. The compact-row feed answer to the DDR-byte-bandwidth-bound scan (~2x rows/sec off DDR, half the host DMA,
    operators unchanged). Covers the SF1 q6 (56-bit) and q1 (41-bit) packings. The batch-latched cfg_bypass config port selects
    the mode: 0 = unpack (packed word in, quad row out); 1 = a zero-added-latency passthrough of pre-widened 16-byte quad
    rows (two words per row, field descriptors unused), so ONE bitstream benchmarks packed vs unpacked rows on the same
    silicon and isolates the host packing overhead. OUT_WIDTH (the rows/cycle axis) selects the quad-stream framing: 64
    (default) emits two 64-bit beats per row; 128 emits one whole quad row per beat ({w1, w0}), lifting the shared-front
    emit cap from ~1 row per 2 cycles to 1 row/cycle (silicon showed the 2-beat emit, not the DDR, gates the packed feed)
    — bypass then gearboxes each two-word quad into one beat. 256, 512 and 1024 carry SLOTS = OUT_WIDTH/128 whole quad rows per beat
    and widen the input to IN_WIDTH = SLOTS*64 (packed row s at [64*s +: 64], quad row s at [128*s +: 128]), which is what lets a
    packed feed drive a SLOTS-wide lane: at 128 the tile emits one row per beat and starves a four-slot wide-row chain. At SLOTS > 1
    a ragged tail is padded by the host with the reserved all-ones packed word and passes through as the reserved all-ones PAD quad
    row the wide-row tiles already drop, so positions are preserved; a field layout whose COVERAGE spans all 64 bits could forge that sentinel from real data and is refused as ERR_CONFIG at SLOTS > 1, which also keeps the answer independent of OUT_WIDTH. In bypass at SLOTS > 1 an input beat is whole quad rows, so input_last on the first phase is a legitimate short final beat (emitted PAD-filled), not a torn row. In a composition this is the front_unpack of a ScanCompositionSpec, placed after the burst
    reader and before broadcast/partition, fed by rows packed with the schema dau_polars.pack.pack_schema derives
    from the column ranges.'
  golden: dau_core.operators:unpack_rows
  bench: dau_core.tests.cocotb_benches.dau_row_unpack_tb
  # the front-stage feed transform: widens packed rows into the quad row the
  # operator tiles read. The composition admits a core into that slot on this
  # declaration rather than on its name
  role: front-unpack
  # RE-MEASURED 2026-08-17, every point, via
  # dau-build task=tasks/build/synthesize-cores. NINE OF THE ELEVEN RECORDED
  # NUMBERS DID NOT REPRODUCE, and none of that is the element-type retype:
  # the identical coordinates against the PRE-retype RTL report exactly what
  # the retyped tile reports, at all eleven points, so the netlist is
  # unchanged and the records were already stale.
  #
  # They were stale because the surface was never measured from one RTL. The
  # 64/128/256/512 points were measured in #159 and #161, and #161 went on to
  # add the pad-coverage config check (packed_bits_covered / pad_is_unreachable)
  # WITHOUT re-measuring what it had already recorded. That check constant-folds
  # away at SLOTS == 1 and does not at SLOTS > 1, which is exactly the shape of
  # the corrections: +80 and -84 LUT at OUT_WIDTH 64 and 128, and +1036, +1038
  # and +1043 at 256, 512 and the Kintex 1024 -- a real cost the wide packed
  # designs were being priced without. The two points that DO reproduce (Artix
  # 1024 at 8 ns, Kintex 1024 at 6.66667 ns) are the ones measured last.
  #
  # Every point here now comes from one run of today's sanctioned task, on the
  # same RTL. BRAM and DSP are zero throughout and unchanged.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {OUT_WIDTH: 64, FIELD_WIDTH: int32}
      lut: 1523
      ff: 197
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 1.943
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {OUT_WIDTH: 64, FIELD_WIDTH: int32}
      lut: 1523
      ff: 197
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 3.866
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {OUT_WIDTH: 128, FIELD_WIDTH: int32}
      lut: 1496
      ff: 260
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 1.778
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {OUT_WIDTH: 128, FIELD_WIDTH: int32}
      lut: 1496
      ff: 260
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 3.687
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {OUT_WIDTH: 256, FIELD_WIDTH: int32}
      lut: 3326
      ff: 448
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 2.192
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {OUT_WIDTH: 256, FIELD_WIDTH: int32}
      lut: 3326
      ff: 448
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 4.109
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {OUT_WIDTH: 512, FIELD_WIDTH: int32}
      lut: 5422
      ff: 834
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 2.185
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {OUT_WIDTH: 512, FIELD_WIDTH: int32}
      lut: 5422
      ff: 834
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 4.118
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {OUT_WIDTH: 1024, FIELD_WIDTH: int32}
      lut: 9534
      ff: 1604
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 4.107
    # Measured 2026-08-11 at 150 MHz via dau-build task=tasks/build/synthesize-cores.
    - part: xc7k325tffg900-2
      clock_ns: 6.66667
      params: {OUT_WIDTH: 1024, FIELD_WIDTH: int32}
      lut: 9534
      ff: 1604
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 2.774
    # Measured 2026-08-11 via dau-build task=tasks/build/synthesize-cores.
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {OUT_WIDTH: 1024, FIELD_WIDTH: int32}
      lut: 9534
      ff: 1604
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 2.171
  contract_kind: row-stream
  record_words: 1
  output_record_words: 2
  # ONE ROW PER 128 OUTPUT BITS, which is what a quad row costs. Scaling
  # 1/128 by OUT_WIDTH yields exactly 1/2, 1, 2, 4 and 8 rows/cycle across
  # 64..1024 from a SINGLE declaration naming a SINGLE parameter.
  #
  # A derived second parameter (words-per-beat) also expresses it, and was
  # tried and rejected: a design setting only OUT_WIDTH would leave the
  # derived one at its registry default, so the declared rate and the RTL's
  # actual behaviour would silently disagree. One parameter cannot drift.
  # frames_on_param cannot serve here because it caps at `rows`.
  #
  # The declared rate stays 1/2 <= 1, so the multi-row claim rides the scaling
  # parameter exactly as the wide-lane cores' does. It is SILICON-PROVEN:
  # 6,001,215 SF1 rows in 5.1 ms at OUT_WIDTH=1024 and 150 MHz is 7.84 of a
  # theoretical 8 rows/cycle, bit-exact (BENCHMARKS 2026-08-11).
  ingest:
    rows: 1
    per_cycles: 128
    scales_with_param: OUT_WIDTH
  parameters:
    OUT_WIDTH:
      default: 64
      choices:
      - 64
      - 128
      - 256
      - 512
      - 1024
    FIELD_WIDTH:
      # the ELEMENT TYPE of the four widened fields. FAMILY-COUPLED: this
      # tile's output IS the quad row the operator tiles read, so it declares
      # the same element they do or the front feeds them the wrong shape. The
      # PACKED word, its 6-bit offsets and the reserved all-ones pad are DDR
      # framing rather than a value's type and do not move with it; the
      # per-field cfg_signed decides sign against zero extension, so only
      # float is refused. int32 encodes as 32, so this declares exactly the
      # tile it always built.
      element_type: true
      default: int32
      # four widened lanes tile the 128-bit quad row
      minimum: 8
      maximum: 32
      # only int32 is MEASURED; the RTL elaborates the whole declared range
      choices: [int32]

