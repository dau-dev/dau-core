keyed-state:
  _target_: dau_core.cores.CoreDefinition
  name: keyed-state
  kind: operator
  module: dau_keyed_state
  source: dau_keyed_state.sv
  description: 'Keyed state tile: the first stateful operator and the owned
    storage class''s first real consumer. A per-key accumulator (SET/ADD/MAX/MIN
    from cfg_op, first row of a key seeded from cfg_initial) emitting the
    post-update state per row -- the loop-carried-per-key shape a SIMD CPU
    cannot vectorize. Hash + linear probe over a CAPACITY-slot BRAM behind a
    key GRANT; a new key past the grant is KEY_CAPACITY_EXCEEDED preserving
    emitted rows, never an eviction. State is fresh per batch (a CLEAR sweep
    runs from both reset and close-out). Deliberately sequential -- no RMW
    hazard exists; the 1-row/cycle CAM/pipelined variant is the named
    follow-up and the declared ingest rate carries the honesty.'
  golden: dau_core.operators:keyed_state_scan
  bench: dau_core.tests.cocotb_benches.dau_keyed_state_tb
  count_port: row_count
  contract_kind: row-stream
  record_words: 1
  ingest:
    rows: 1
    # the zero-collision cadence: ROW+PROBE+JUDGE+EMITx2 = 5 cycles/row.
    # Acceptance for probe depth p is 2p+3, so the STATED ASSUMPTION is
    # hash-distributed keys at low load factor (p ~= 1). Adversarial
    # congruent-key fills degrade to 1/(2*CAPACITY+3) -- a planner-regime
    # concern per the IngestRate doctrine (like the dispatcher's same-lane
    # runs), visible here rather than hidden behind a padded number.
    per_cycles: 5
  success_close_out: true
  parameters:
    CAPACITY:
      default: 1024
      minimum: 1
      maximum: 1024
    FIELD_WIDTH:
      # the ELEMENT TYPE of the key and value lanes -- one type, because the
      # two share a 64-bit word and the emitted record mirrors the accepted
      # one. The accumulator orders and adds two's-complement magnitudes, so
      # the tile's own guard refuses float and unsigned types. int32 encodes
      # as 32, so this declares exactly the tile it always built.
      element_type: true
      default: int32
      minimum: 8
      maximum: 32
      # only int32 is MEASURED; the RTL elaborates the whole declared range
      choices: [int32]
  # OOC on both parts, 8 ns, CAPACITY=1024. 1024 x 64-bit slots = exactly
  # two RAMB36; the valid bitmap rides in LUTRAM.
  #
  # RE-MEASURED 2026-08-16 alongside the element-type retype, which is where
  # the LUT count moved by one. Not because of the retype: the same
  # coordinate on the PRE-retype RTL reports the same 409 on both parts, so
  # the netlist is unchanged and the recorded 408 simply predates
  # dau-build#165, which put `-include_dirs` on synth_design. Every other
  # number, including WNS to the picosecond, is what it was.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {CAPACITY: 1024, FIELD_WIDTH: int32}
      lut: 409
      ff: 389
      bram36: 2.0
      dsp: 0
      timing: met
      wns_ns: 1.289
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {CAPACITY: 1024, FIELD_WIDTH: int32}
      lut: 409
      ff: 389
      bram36: 2.0
      dsp: 0
      timing: met
      wns_ns: 2.996
  storage_intent:
    - role: state_table
      access: owned
      # 8 bytes {key, value} per slot; the valid bitmap rides in LUTRAM
      bytes_per_unit: 8
      scale_parameter: CAPACITY
      tier_hint: bram

session-gap:
  _target_: dau_core.cores.CoreDefinition
  name: session-gap
  kind: operator
  module: dau_session_gap
  source: dau_session_gap.sv
  description: 'Session-gap tile: the Nexmark-Q11 shape over bounded keyed
    state (STORAGE_AND_NOC.md). Per-key sessions over time-ordered {time,key}
    rows: a row past its key''s last time by more than cfg_gap closes the
    old session
    (emitted immediately, arrival order, two words {start,key}/{count,last})
    and opens a new one; batch end drains open sessions SORTED BY SIGNED KEY
    via repeated minimum extraction, so no hash placement leaks into the
    contract. Processing-order scope: a time running backwards is TIME_ORDER,
    refused, never reordered -- event time and watermarks are out of scope.
    Composes the keyed-state table pattern (hash + linear probe, sequential,
    grant bounds distinct keys). Error close-outs preserve emitted sessions
    and skip the drain.'
  golden: dau_core.operators:sessionize_scan
  bench: dau_core.tests.cocotb_benches.dau_session_gap_tb
  count_port: session_count
  contract_kind: row-stream
  record_words: 1
  output_record_words: 2
  ingest:
    rows: 1
    # non-splitting rows cost ROW+PROBE+JUDGE = 3 cycles at probe depth 1;
    # a gap split adds two emission beats; acceptance at probe depth p is
    # 2p+3. STATED ASSUMPTION: hash-distributed keys at low load factor.
    # The batch-end drain is O(CAPACITY x live) close-out cost, batch-tail
    # amortized per the IngestRate doctrine; adversarial congruent-key
    # fills degrade the row path to 1/(2*CAPACITY+3) -- a planner-regime
    # concern, stated here rather than hidden.
    per_cycles: 5
  success_close_out: true
  parameters:
    CAPACITY:
      default: 1024
      minimum: 1
      maximum: 1024
    FIELD_WIDTH:
      # the ELEMENT TYPE of every lane of the row and of the emitted session,
      # INCLUDING the session's row count -- count shares a word with `last`,
      # and a record whose halves had different widths would not decode by the
      # family's rule. That is also why only int32 is offered: a narrower type
      # bounds the count a session can report, and a count that wrapped
      # silently is worse than one that cannot be asked for. Times are
      # subtracted and keys sorted signed, so the tile's own guard refuses
      # float and unsigned types.
      element_type: true
      default: int32
      minimum: 8
      maximum: 32
      choices: [int32]
  # OOC on both parts, 8 ns, CAPACITY=1024. 1024 x 128-bit slots = exactly
  # four RAMB36. The dpv1 margin is the tightest of the stateful tiles (the
  # 33-bit gap compare plus the 128-bit slot path) but met.
  #
  # RE-MEASURED 2026-08-16, same cause as the keyed state tile beside it: the
  # PRE-retype RTL reports these same numbers at both coordinates, so the
  # retype moved nothing and the recorded 567/566 predate dau-build#165's
  # `-include_dirs`. Both parts now land on the same 576, which is what a
  # part-independent front end should do.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {CAPACITY: 1024, FIELD_WIDTH: int32}
      lut: 576
      ff: 575
      bram36: 4.0
      dsp: 0
      timing: met
      wns_ns: 0.249
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {CAPACITY: 1024, FIELD_WIDTH: int32}
      lut: 576
      ff: 575
      bram36: 4.0
      dsp: 0
      timing: met
      wns_ns: 2.423
  storage_intent:
    - role: session_table
      access: owned
      # 16 bytes {key, start, last, count} per slot; valid bits ride LUTRAM
      bytes_per_unit: 16
      scale_parameter: CAPACITY
      tier_hint: bram
datetime-format:
  _target_: dau_core.cores.CoreDefinition
  name: datetime-format
  kind: operator
  module: dau_datetime_format
  source: dau_datetime_format.sv
  description: 'Datetime formatter: one int64 epoch-SECONDS value per beat in, the 19-byte ASCII rendering "YYYY-MM-DD
    HH:MM:SS" out, one row per cycle. This is the hardware answer to a per-row string build on the CPU (polars
    dt.to_string). The civil date is Howard Hinnant''s civil_from_days and the time of day is three constant divisions,
    so EVERY division in the tile is by a compile-time constant and every one is a multiply-shift with the divisor''s
    power-of-two factor peeled off first (86400 = 128*675, 3600 = 16*225, 1460 = 4*365, ...); there is no general
    divider. Leap years are exact -- all three rules -- because they fall out of the 400-year era arithmetic rather than
    being special-cased. Binary-to-BCD is double dabble, the year''s fourteen iterations split across two pipeline
    stages. THE OUTPUT BEAT IS 152 BITS, not the 64-bit lane word: 19 bytes per row at one row per cycle is 2.85 GB/s at
    150 MHz, which no 64-bit lane carries, so a lane consumer either takes the wide beat or pays a three-word serializer
    (and one row per three cycles) behind it. The port names and directions are the row-stream contract''s; the width is
    not. Input outside [0, 253402300799] -- 1970-01-01T00:00:00 through 9999-12-31T23:59:59, the range a four-digit year
    renders -- closes the batch out with ERR_DOMAIN rather than emitting a truncated year. Matches
    dau_core.operators.format_datetime_rows.'
  golden: dau_core.operators:format_datetime_rows
  bench: dau_core.tests.cocotb_benches.dau_datetime_format_tb
  contract_kind: row-stream
  record_words: 1
  # 19 ASCII bytes is 152 bits, which is THREE 64-bit words. The description
  # has always said so, but prose is not what the composition layer reads:
  # declaring 1 here told the width check this tile emits 64 bits, and that
  # check is detection-only, so the mismatch would be reported and wired up
  # anyway, dropping 11 of the 19 characters. See test_output_beat_declarations.
  output_record_words: 3
  ingest:
    rows: 1
    per_cycles: 1
  # Measured 2026-08-13 via dau-build task=tasks/build/synthesize-cores,
  # Vivado 2025.2. The tile is DSP-priced, not LUT-priced: the eleven
  # multiply-shift divisions map to 17 DSP48E1s, and the pipeline's pure carry
  # chains (time-of-day, day-of-era, era) map to 72 LUTs of SRL rather than to
  # flops, which is why 24 stages cost 428 FF. Only 296 LUTs are logic. The
  # margin at 6.667 ns is 0.240 ns, under the half-nanosecond line: budget a
  # retime before composing this at 150 MHz.
  resources:
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {}
      lut: 368
      ff: 428
      bram36: 0.0
      dsp: 17
      timing: met
      wns_ns: 1.573
    - part: xc7k325tffg900-2
      clock_ns: 6.667
      params: {}
      lut: 368
      ff: 428
      bram36: 0.0
      dsp: 17
      timing: met
      wns_ns: 0.240
