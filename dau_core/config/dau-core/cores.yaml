    lut: 910
    ff: 886
    bram36: 0.0
    dsp: 0
  count_port: group_count
  contract_kind: row-stream
  record_words: 2
  output_record_words: 11
  ingest:
    rows: 1
    per_cycles: 2
  success_close_out: true

