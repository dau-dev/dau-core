int32-rolling-moments:
  _target_: dau_core.cores.CoreDefinition
  name: int32-rolling-moments
  kind: operator
  module: dau_int32_rolling_moments
  source: dau_int32_rolling_moments.sv
  description: Per-symbol rolling-moment tile (the roll stage of the temporal workflow, over the reduced bar/feature stream).
    Over a count-based window of the last WINDOW values per symbol, emits the deferred-division moment record (count, sum,
    sum-of-squares) for every FULL window — one tile serving rolling sum (=sum), mean (=sum/count) and sample variance (=(count*sum_sq
    - sum*sum)/(count*(count-1)), the host dividing once). One 32-bit value per row (w0 = {value, symbol}); because the
    host-sorted stream is symbol-grouped the tile holds ONE window (a depth-WINDOW shift register) reset on symbol change
    — the bar tile's key-change shape, no per-symbol table. Warm-up rows (window not yet full) are dropped, matching the
    None entries of dau_core.temporal.rolling_moments/rolling_sum. The moment update pipelines over four beats (READ->MUL->DIFF->UPDATE)
    keeping the 32x32 DSP products and the difference/accumulate off one path; one record is buffered so the final emitted
    record carries output_last. WINDOW >= 2 (a size-1 sample variance is undefined; the compiler residues it).
  golden: dau_core.temporal:rolling_moments
  bench: dau_core.tests.cocotb_benches.dau_int32_rolling_moments_tb
  # OOC WINDOW=4 xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +3.155)
  # Measured 2026-08-11 via dau-build task=tasks/build/synthesize-cores.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {WINDOW: 4}
      lut: 683
      ff: 1001
      bram36: 0.0
      dsp: 8
      timing: met
      wns_ns: 3.155
    - part: xc7k325tffg900-2
      clock_ns: 8.0
      params: {WINDOW: 4}
      lut: 683
      ff: 1001
      bram36: 0.0
      dsp: 8
      timing: met
      wns_ns: 3.892
  count_port: moment_count
  contract_kind: row-stream
  record_words: 1
  output_record_words: 3
  # static FSM bound: 4-beat moment update + 3-word record emit + drain beat per full-window row; a bench-measured tighter floor may raise it
  ingest:
    rows: 1
    per_cycles: 8
  success_close_out: true
  parameters:
    WINDOW:
      default: 4
      minimum: 2

rolling-extremum:
  _target_: dau_core.cores.CoreDefinition
  name: rolling-extremum
  kind: operator
  module: dau_rolling_extremum
  source: dau_rolling_extremum.sv
  description: Keyed rolling extremum (max or min) over a fixed count window, as a SEGMENTED Hillis-Steele network of
    ceil(log2 WINDOW) stages. Serves a NON-INVERTIBLE aggregate, which subtract-on-evict structurally cannot. Deliberately
    carries NO int32- prefix - extremum is the aggregate whose result does not depend on the width it is computed in,
    because sign extension is order preserving, so one build serves every signed integer type that fits the value field and
    VALUE_WIDTH selects the FRAMING (words per row) rather than the arithmetic. Its accumulating neighbours cannot make that
    claim, which is why they keep theirs. A symbol change is a segment boundary and resets the window for free on the
    host-sorted, symbol-grouped stream. Warm-up rows (window not yet full) are dropped, matching the None entries of
    dau_core.temporal.rolling_max/rolling_min. SILENT ON SUCCESS while forwarding, so it chains mid-lane - the newest
    emitted row is held in a skid released when a newer row completes or the stream ends, so output_last always lands on
    the final forwarded row even when trailing rows are warm-up; a stream forwarding ZERO rows still closes out, because
    that is the one outcome a downstream tile cannot tell from a stall. WINDOW is a power of two so the network spans it
    exactly. Backpressure freezes the whole pipeline, never just the input - an in-flight row would otherwise reach the end
    against a full skid and be dropped silently.
  # FIND_MAX selects which of the pair this build computes; the bench proves
  # both against their own golden.
  golden: dau_core.temporal:rolling_max
  bench: dau_core.tests.cocotb_benches.dau_rolling_extremum_tb
  contract_kind: row-stream
  # the record shape FOLLOWS the value width: a 64-bit value needs two stream
  # words, and a fixed 1 here would let a composition mis-slice every row of a
  # 64-bit build
  record_words_param: RECORD_WORDS
  output_record_words_param: RECORD_WORDS
  # The network is STRUCTURALLY II=1 -- no loop-carried dependency, one row
  # per cycle through every stage, and the bench sustains it. The declaration
  # is nonetheless the composed 1-row/2-cycle lane floor, because a full-rate
  # claim is a measured upgrade and this tile has not been measured on
  # silicon. Under-declaring a floor is safe for the scheduler; over-declaring
  # one is not.
  ingest:
    rows: 1
    per_cycles: 2
  success_close_out: false
  parameters:
    WINDOW:
      default: 4
      minimum: 2
      # both bounds mirror the RTL elaboration guards: the Hillis-Steele
      # network spans exactly 2**K, so a non-power-of-two window would report
      # a window the caller did not ask for
      maximum: 256
      power_of_two: true
    VALUE_WIDTH:
      default: 32
      choices: [32, 64]
    RECORD_WORDS:
      default: 1
      choices: [1, 2]
    FIND_MAX:
      # an enumerated flag, not a count -- without the choices the blanket
      # positive-int rule makes the MIN build (0) unreachable through
      # composition even though the bench proves it
      choices: [0, 1]
      default: 1
  # Measured via dau-build task=tasks/build/synthesize-cores, RE-MEASURED
  # 2026-08-11 after the review fixes: the close-out latch and the
  # rearm path cost a handful of LUT and two FF at every point, which
  # is what the drift check caught.
  # Zero DSP and zero BRAM at every point: the network is comparators and
  # registers, and it holds its own delay lines in fabric flops.
  #
  # The SLACK IS THE RESULT. Across a 16x window range and both value
  # widths the margin never drops below +4.0 ns at 8 ns, because the
  # critical path is one comparator plus one mux at every stage no matter
  # how many stages there are -- which is the whole claim of the log-depth
  # form, now measured rather than argued. Cost grows with WINDOW (more
  # stages, deeper lines) while timing does not.
  #
  # The estimate this tile was proposed on said ~400-600 LUT and ~400 FF at
  # WINDOW=64. LUT landed inside it at 460; FF was under by 2.2x at 899.
  # The delay lines were costed, the per-stage run/symbol/valid registers
  # carried alongside them were not.
  resources:
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {WINDOW: 4, VALUE_WIDTH: 32, RECORD_WORDS: 1, FIND_MAX: 1}
      lut: 136
      ff: 409
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 4.771
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {WINDOW: 16, VALUE_WIDTH: 32, RECORD_WORDS: 1, FIND_MAX: 1}
      lut: 287
      ff: 628
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 4.523
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {WINDOW: 64, VALUE_WIDTH: 32, RECORD_WORDS: 1, FIND_MAX: 1}
      lut: 467
      ff: 901
      bram36: 0.0
      dsp: 0
      timing: met
      wns_ns: 4.213
    - part: xc7a200tfbg484-2
      clock_ns: 8.0
      params: {WINDOW: 4, VALUE_WIDTH: 64, RECORD_WORDS: 2, FIND_MAX: 1}
      lut: 293
      ff: 702
      bram36: 0.0
      dsp: 0
      timing: met
