  name: stride-distributor
  kind: operator
  module: dau_stride_distributor
  source: dau_stride_distributor.sv
  description: 'Static stride distributor: routes each slot of an IN_WIDTH-wide quad-row beat round-robin within its own
    contiguous lane group, drops all-ones PAD rows, and emits independent 64-bit two-beat streams for existing stateful
    terminals. Routing is positional and never key-dependent; per-lane keyed partials are merged by key on the host.'
  golden: dau_core.operators:stride_distribute_rows
  bench: dau_core.tests.cocotb_benches.dau_stride_distributor_tb
  contract_kind: row-stream
  record_words: 2
  ingest:
    rows: 1
    per_cycles: 1
