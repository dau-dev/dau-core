# @package dau-core
# The dau-core tile registry: one CoreDefinition per HDL building block,
# loaded into the ccflow ModelRegistry at /dau-core/<core-name>. Hydra
# composition IS the registry -- there is no Python-literal core list.
# Resource envelopes are produced by the dau-build synthesize-cores task;
# never hand-run synthesis.
# Ingest floors: the 1-row/2-cycle declarations rest on the composed
# broadcast measurement (q6-scan 64-bit, 4 lanes each consuming the full
# stream: 99.3 ms / 6.0 M rows @ 125 MHz = 2.07 cycles/row/lane including
# job setup/drain overhead, 2026-07-30) — consistent with a 2-cycle
# steady state; static FSM reading understates the ingest/output overlap.
# The per-core cocotb bench is the per-core authority: a core whose bench
# shows it cannot sustain 1/2 must lower its declaration. Floors describe
# the STREAMING regime (record/drain emission amortized per batch/group —
# see IngestRate); data-dependent worst cases are planner concerns.
# Sustained-rate assertions in every bench are the tracked follow-up.
# Stream ABI widths are logical records measured in 64-bit words, independent
# of physical beat width. Omitted output widths preserve the input shape;
# reshapers declare their output, and runtime-variable aggregation records say
# so explicitly. supports_pipeline_depth is reserved for combinational-per-beat
# transforms where generic elastic register stages preserve framing semantics.
aggregation-pkg:
  _target_: dau_core.cores.CoreDefinition
  name: aggregation-pkg
  kind: package
  module: dau_aggregation_pkg
  source: dau_aggregation_pkg.sv
  description: Shared accumulate-step definition for every aggregation core.

