asof-backward:
  _target_: dau_core.cores.CoreDefinition
  name: asof-backward
  kind: operator
  module: dau_asof_backward
  source: dau_asof_backward.sv
  description: 'Generic keyed backward as-of join: over one host-merged (key, time)-sorted stream of BUILD and PROBE records
    (build-before-probe at equal key/time), attaches to each probe the most recent build for the same key with build_time
    <= probe_time, optionally within cfg_tolerance on the time axis. Each 3-word record is w0={rec_type, key} (rec_type
    bit0: 0=build/1=probe), w1=time[63:0], w2={payload_b, payload_a} (two opaque INT32 fields); because the stream is key-grouped
    the tile holds ONE current build, reset on key change (the key-change shape) — bounded state, one pass, no per-key table.
    A matched probe emits a 4-word joined row (time, {probe_a, key}, {build_b, build_a}, {_, probe_b}); a miss (no live
    build, or older than tolerance) drops, so the tile realizes matched joins only. The temporal-finance backward as-of
    is this join with quote=build {bid, ask}, trade=probe {price, size}, key=symbol — the finance vocabulary lives in the
    host merge, not the tile. A record torn by input_last before its third word is ERR_STREAM.'
  golden: dau_core.operators:keyed_asof_join_rows
  bench: dau_core.tests.cocotb_benches.dau_asof_backward_tb
  # OOC xc7a200tfbg484-2, Vivado 2025.2, 8 ns met (WNS +1.679)
