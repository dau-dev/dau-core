    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@ec67f82b3bd863948308a41ecb9e70547cbb19c7
        with:
          version: "3.11"

      - name: Install dependencies
        run: make develop

      # for the ELABORATION tier only — `verilator --lint-only` over every
      # declared parameterization, seconds of work, and the one thing in the
      # suite that catches an RTL retype. `make coverage` deselects the
      # compile tier, which stays in `hdl`.
      #
      # timeout-minutes is on the STEP, not just the job: this exact download
      # wedged for 60 minutes once and took a whole bench run with it, which
      # is the failure a required check must never be able to have.
      - name: Install simulation tools (verilator)
        timeout-minutes: 5
        run: |
          gh release download v0.0.14 --repo dau-dev/tools --pattern 'verilator_*.deb' --dir /tmp/tools
          sudo apt-get update
          sudo apt-get install -y /tmp/tools/verilator_*.deb
          verilator --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Lint
        run: make lint

      - name: Checks
        run: make checks

      - name: Build
        run: make build

      # DAU_REQUIRE_VERILATOR turns "the elaboration tier skipped" into a
      # failure. Without it a verilator install that quietly did not take
      # leaves this job green having elaborated nothing.
      - name: Test
        run: make coverage
        env:
          DAU_REQUIRE_VERILATOR: "1"

      - name: Upload test results (Python)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results
          path: junit.xml
        if: always()

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        with:
          files: '**/junit.xml'

      - name: Upload coverage
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4  # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build distributions
        run: make dist

      - name: Test wheel
        uses: actions-ext/python/test-wheel@ec67f82b3bd863948308a41ecb9e70547cbb19c7
        with:
          module: dau_core

      - name: Test source distribution
        uses: actions-ext/python/test-sdist@ec67f82b3bd863948308a41ecb9e70547cbb19c7
        with:
          module: dau_core

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist

  # the benches compile and simulate RTL, which the `build` job cannot afford:
  # they live here so a python-only change keeps its fast signal and a bench
  # still runs on every pull request
  hdl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@ec67f82b3bd863948308a41ecb9e70547cbb19c7
        with:
          version: "3.11"

      - name: Install dependencies
        run: make develop

      - name: Install simulation tools (verilator)
        run: |
          gh release download v0.0.14 --repo dau-dev/tools --pattern 'verilator_*.deb' --dir /tmp/tools
          sudo apt-get update
          sudo apt-get install -y /tmp/tools/verilator_*.deb
          verilator --version
          nproc
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Benches
        run: make test-hdl
